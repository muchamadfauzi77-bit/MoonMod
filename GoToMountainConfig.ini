; ============================================================================
; GO TO MOUNTAIN - GAMEPLAY CONFIG
; ============================================================================
; POS options, default route, serta koordinat START/FINISH.
; Pilihan dari startup HUD tetap menjadi sumber utama saat mode full digunakan.

; --- PILIHAN TOTAL POS DI MENU ---
[POS_OPTIONS]
; Maksimal 4 pilihan, masing-masing 1-20.
Options=2,3,4,5

; --- MISSION / ROUTE ---
[MISSION]
; Legacy mode flags. Startup selection dapat menimpanya saat game dimulai.
GoToMountain=true
GotoMountainPos=false

; Toggle effect legacy/default. Difficulty startup dapat menimpanya.
RandomChaosEnabled=false
RandomCheckpointEnabled=false

; Dipakai saat MoonModConfig.ini GameplayMode=gotomountain.
; 0 = DIRECT TO MOUNTAIN, >0 = jumlah POS dan harus tersedia di [POS_OPTIONS].
DefaultPosCount=0

; Compatibility lama.
PosCount=5

; --- ROUTE FAILSAFE ---
; true = jika pembuatan POS gagal / terlalu lama, otomatis DIRECT START -> FINISH.
; false = terus mencoba membuat route POS seperti behavior lama.
FallbackToDirectOnRouteFail=true

; Batas waktu builder POS sebelum otomatis DIRECT.
; Range parser: 3-120 detik.
RouteBuildTimeoutSeconds=8

; Koordinat tetap untuk mission Go To Mountain.
START_POS=-1012.173, -2733.264, 13.7578
FINISH_POS=500.8116, 5604.0986, 797.9102
