; ============================================================================
; SURVIVAL - GAMEPLAY CONFIG
; ============================================================================
; POS options, default route, aturan kendaraan, dan jarak route random.

; --- PILIHAN TOTAL POS DI MENU ---
[POS_OPTIONS]
; Maksimal 4 pilihan, masing-masing 1-20.
Options=5,10,15,20

; --- SURVIVAL ---
[SURVIVAL]
; Aturan dasar.
NoVehicle=true
RandomStart=true

; Dipakai saat MoonModConfig.ini GameplayMode=survival.
; 0 = DIRECT FINISH LINE, >0 = jumlah POS dan harus tersedia di [POS_OPTIONS].
DefaultPosCount=10

; Jarak DIRECT FINISH LINE.
DirectMinDistance=4500
DirectMaxDistance=6500

; Jarak antar checkpoint mengikuti urutan angka di [POS_OPTIONS].
; Option1 = angka pertama, Option2 = angka kedua, dst.
MinDistanceOption1=1000
MaxDistanceOption1=1400

MinDistanceOption2=550
MaxDistanceOption2=800

MinDistanceOption3=350
MaxDistanceOption3=550

MinDistanceOption4=250
MaxDistanceOption4=400

; Maksimum percobaan mencari road node untuk satu titik.
RoutePointAttempts=80
