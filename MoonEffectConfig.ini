; ============================================================================
; MOONMOD - EFFECT / WEBHOOK CONFIG
; ============================================================================
; Urutan: global -> direct gift -> effect khusus -> teleport -> random systems.
; Duration pada pool hanya dipakai untuk timed effect; one-shot mengabaikannya.

; --- GLOBAL EFFECT TOGGLES ---
[MISSION]
; Difficulty startup dapat menimpa toggle ini.
RandomChaosEnabled=false
RandomCheckpointEnabled=false
PosCount=5

; --- DEFAULT TIMER UNTUK DIRECT GIFT ---
[TIME_DEFAULT]
; Satuan *Seconds = detik. Boost kendaraan memakai m/s.
