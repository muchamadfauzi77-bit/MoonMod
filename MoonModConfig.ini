; ============================================================================
; MOONMOD - GLOBAL CONFIG
; ============================================================================
; Urutan: startup -> server -> player -> score -> underwater.
; Edit nilai di kanan tanda '='.

; --- ALUR STARTUP ---
[STARTUP]
; true = lewati pemilihan profile, tanpa nama host, tidak save statistik profile.
; false = tampilkan pemilihan profile seperti biasa.
SkipProfileSelection=false

; full         = PROFILE -> GAMEPLAY -> DIFFICULTY -> START.
; gotomountain = mode/route dari GoToMountainConfig.ini; GAMEPLAY + DIFFICULTY dilewati.
; survival     = mode/route dari SurvivalConfig.ini; GAMEPLAY + DIFFICULTY dilewati.
; Jika profile tidak di-skip, tombol profile otomatis berubah dari NEXT menjadi START.
GameplayMode=full

; --- SERVER / WEBHOOK ---
[MOONMOD]
WebhookPort=6722

; --- HUD DESIGN / PRESET ---
[HUD_DESIGN]
; Layout menentukan bentuk/posisi HUD gameplay.
; Saat ini tersedia: default, design2.
Layout=default

; Preset hanya mengubah style aman seperti warna/font/shadow/edge.
; Preset berada di scripts/design/preset/
; Pilihan bawaan: default, graphite, ocean, amber.
Preset=default

; --- DEFAULT PLAYER WEAPONS ---
[PLAYER_WEAPONS]
; Tambah/hapus WeaponN untuk menentukan weapon yang selalu dimiliki player.
; Bisa memakai nama GTA (WEAPON_...) atau hash hex (0x...).
; Nomor Weapon1/Weapon2/... hanya urutan; jumlahnya bebas.
; Jika section ini tidak memiliki WeaponN, player hanya memiliki UNARMED.
Weapon1=WEAPON_APPISTOL
Weapon2=WEAPON_RAYCARBINE
Weapon3=WEAPON_ASSAULTSHOTGUN
Weapon4=WEAPON_TACTICALRIFLE
Weapon5=WEAPON_PRECISIONRIFLE
Weapon6=WEAPON_RPG
Weapon7=WEAPON_GRENADE

; --- PLAYER ---
[PLAYER]
; MaxHealth = HP maksimal. RegenDelay/Interval memakai milidetik.
MaxHealth=5000
HealthRegenAmount=5
HealthRegenDelay=100
HealthRegenInterval=500

; --- SCORE ---
[SCORE]
; Reward/penalty global yang dipakai kedua gameplay mode.
PosReward=1
FinishReward=3
EnemyDeathsPerPenalty=3
EnemyDeathPenalty=1
BackToStartPenalty=3

; --- UNDERWATER RESCUE ---
[UNDERWATER]
; Jika aktif, player yang terlalu lama di bawah air dipindahkan ke daratan.
Enabled=true
UnderwaterSeconds=30
TeleportWarningSeconds=5
SearchLandMaxDistance=300
